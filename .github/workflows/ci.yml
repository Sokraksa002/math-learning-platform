name: CI

on:
  push:
    branches: [ backend ]
  pull_request:
    branches: [ backend ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: math_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d math_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: apps/backend
        run: npm ci

      - name: Auth guard check
        working-directory: apps/backend
        run: node scripts/check-auth-guards.js

      - name: Set DATABASE_URL
        run: echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/math_test?schema=public" >> $GITHUB_ENV

      - name: Generate Prisma client
        working-directory: apps/backend
        run: npx prisma generate

      - name: Run unit tests and coverage
        working-directory: apps/backend
        run: npm run coverage

      - name: Run integration tests (serial)
        working-directory: apps/backend
        run: npm run test:integration

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: apps/backend/coverage/lcov.info
          flags: backend
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
